name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test tests/unit

      - name: Web build (Next.js App Router)
        run: bun run build:web

      - name: Build CLI bundle
        run: bun run build:cli

      - name: Syntax-check tools
        run: |
          for f in tools/*.mjs; do
            node --check "$f"
          done

      - name: Smoke test (help)
        run: node dist/index.js --help

      - name: Docs parity check (zh/en)
        run: |
          # every Chinese doc must have an English counterpart and vice versa
          zh_count=$(ls docs/zh/*.md | wc -l)
          en_count=$(ls docs/en/*.md | wc -l)
          test "$zh_count" -eq "$en_count" \
            || { echo "docs/zh has $zh_count files, docs/en has $en_count"; exit 1; }
          echo "docs parity OK ($zh_count files each)"
